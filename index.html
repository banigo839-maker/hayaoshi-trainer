<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18181b"><link rel="manifest" href="./manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%2318181b%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27white%27%3EQ%3C/text%3E%3C/svg%3E"><title>Anki傾斜 早押しTrainer</title>
<style>body{font-family:system-ui;margin:0;background:#f4f4f5;color:#18181b}header{background:#18181b;color:white;padding:12px;position:sticky;top:0}main{max-width:760px;margin:auto;padding:12px}.c{background:white;border-radius:15px;padding:16px;margin:10px 0}button,select{padding:11px;border:0;border-radius:10px;font-weight:700;margin:3px}.b{background:#2563eb;color:white}.r{background:#dc2626;color:white}.g{background:#16a34a;color:white}.a{background:#f59e0b;color:white}.p{background:#7c3aed;color:white}#q{font-size:22px;line-height:1.9;min-height:250px;white-space:pre-wrap}#ans,#grades,#reveal{display:none}.buzz #reveal{display:block}.revealed #ans,.revealed #grades{display:block}.revealed #reveal{display:none}#ans{background:#ecfdf5;padding:12px;border-radius:10px}.cut{border-left:4px solid #dc2626;padding-left:3px}.fullq{background:#f8fafc;padding:12px;border-radius:10px;margin-bottom:10px;line-height:1.7}.hint{font-size:12px;color:#64748b}.big{width:100%;font-size:20px;padding:17px}</style>
<header><b>Anki傾斜 早押しTrainer</b>　<span id=n>0/0</span><br>出題 <select id=mode><option value=anki>Anki優先</option><option value=weak>苦手優先</option><option value=due>Due順</option><option value=random>ランダム</option></select>　速度 <input id=spd type=range min=40 max=400 value=120 step=10><span id=sv>120ms/字</span></header>
<main><div class=c><input id=file type=file accept=".csv,.txt,.tsv"><button id=load>CSV / Anki TXTを読込</button>
<div style="margin-top:10px"><select id="deckSelect"></select><button id="openDeck">問題集を開く</button><button id="deleteDeck">削除</button></div><p><small>学習状態CSVとAnkiの「ノートをプレーンテキストで書き出す」TXTに対応。TXTには学習状態がないため、傾斜出題はCSV読込時のみ有効です。</small></p></div>
<div class=c id=card><small id=meta></small><div id=q></div><button class="b big" id=start>出題開始</button><button class="r big" id=buzz style="display:none">押す！</button><button class="b big" id=reveal>答えを見る</button><div id=ans></div><div id=grades><button class=r data-e=1>Again</button><button class=a data-e=2>Hard</button><button class=g data-e=3>Good</button><button class=p data-e=4>Easy</button><button id=resume>続きを読む</button></div></div>
<div class=c><button id=prev>←前</button><button class=b id=next>次へ</button><button class=b id=export>Anki同期CSV</button> <span id=qc></span></div></main>
<script>
let d=[],o=[],pos=0,i=0,t=null,bp=null,state="ready",Q=JSON.parse(localStorage.getItem("slopeQ")||"[]");const E=x=>document.getElementById(x);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function num(x,z=0){x=Number(x);return isFinite(x)?x:z}function score(x){return num(x.Lapses)*25+60/(num(x.Interval)+1)+Math.log1p(num(x.Reviews))*3+Math.max(0,(2500-num(x.Ease,2500))/100)}
function build(){o=d.map((_,i)=>i);let m=E("mode").value;if(m=="random")o.sort(()=>Math.random()-.5);else if(m=="due")o.sort((a,b)=>num(d[a].Due,1e15)-num(d[b].Due,1e15));else if(m=="weak")o.sort((a,b)=>(num(d[b].Lapses)*100+60/(num(d[b].Interval)+1))-(num(d[a].Lapses)*100+60/(num(d[a].Interval)+1)));else o.sort((a,b)=>score(d[b])-score(d[a]));pos=0;reset()}
function cur(){return d[o[pos]]}function stop(){clearTimeout(t);t=null}function reset(){stop();i=0;bp=null;state="ready";E("card").classList.remove("buzz","revealed");E("q").textContent="";E("qc").textContent="同期待ち "+Q.length;if(!d.length)return;let x=cur();E("ans").innerHTML="";E("meta").textContent="Interval "+x.Interval+"日 / Lapses "+x.Lapses+" / Reviews "+x.Reviews+" / Due "+x.Due;E("n").textContent=(pos+1)+"/"+d.length;E("start").style.display="block";E("buzz").style.display="none"}
function tick(){if(state!="reading")return;let s=cur().Front;if(i>=s.length){state="finished";return}E("q").textContent=s.slice(0,++i);t=setTimeout(tick,+E("spd").value)}
E("start").onclick=()=>{state="reading";E("start").style.display="none";E("buzz").style.display="block";tick()};E("buzz").onclick=()=>{if(!["reading","finished"].includes(state))return;stop();bp=i;state="buzz";E("card").classList.add("buzz");E("card").classList.remove("revealed")};E("resume").onclick=()=>{E("card").classList.remove("buzz","revealed");bp=null;state="reading";tick()};E("reveal").onclick=()=>{if(state=="buzz"){let x=cur(),p=bp??i,a=x.Front.slice(0,p),b=x.Front.slice(p);E("q").textContent=x.Front;E("ans").innerHTML='<div class="fullq"><div class="hint">問題全文（赤線が押した位置）</div>'+esc(a)+'<span class="cut">'+esc(b)+'</span></div><b>正解：</b>'+esc(x.Back);E("meta").textContent="押した位置 "+p+"/"+x.Front.length+"字 ("+Math.round(p/x.Front.length*100)+"%)";E("card").classList.add("revealed")}};
function next(){pos=(pos+1)%d.length;reset()}E("next").onclick=next;E("prev").onclick=()=>{pos=(pos-1+d.length)%d.length;reset()};document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{let x=cur();Q.push({CardID:x.CardID,Ease:+b.dataset.e,Date:new Date().toISOString(),Front:x.Front});localStorage.setItem("slopeQ",JSON.stringify(Q));next()});
function parse(s){let R=[],r=[],c="",z=false;for(let j=0;j<s.length;j++){let x=s[j];if(x=='"'){if(z&&s[j+1]=='"'){c+='"';j++}else z=!z}else if(x==','&&!z){r.push(c);c=""}else if((x=="\n"||x=="\r")&&!z){if(x=="\r"&&s[j+1]=="\n")j++;r.push(c);if(r.some(v=>v.trim()))R.push(r);r=[];c=""}else c+=x}r.push(c);if(r.some(v=>v.trim()))R.push(r);return R}

let deckStore=JSON.parse(localStorage.getItem("hayaoshi_decks")||"{}");
function saveDeckStore(){localStorage.setItem("hayaoshi_decks",JSON.stringify(deckStore))}
function refreshDecks(){
 let sel=E("deckSelect"); if(!sel)return; let current=sel.value; sel.innerHTML="";
 Object.keys(deckStore).forEach(n=>{let op=document.createElement("option");op.value=n;op.textContent=n+" ("+deckStore[n].length+"問)";sel.appendChild(op)});
 if(deckStore[current])sel.value=current;
}
function openSavedDeck(n){
 if(!deckStore[n])return; d=deckStore[n];localStorage.setItem("hayaoshi_last_name",n);build();
}
E("load").onclick=async()=>{let f=E("file").files[0];if(!f)return alert("ファイルを選択");let text=await f.text(),arr=[];
if(/^\s*#separator:tab/m.test(text)||/\.(txt|tsv)$/i.test(f.name)){
 let lines=text.split(/\r?\n/).filter(x=>x.trim()&&!x.startsWith("#"));
 for(let line of lines){let p=line.split("\t");if(p.length>=2&&p[0].trim()&&p[1].trim())arr.push({CardID:"",Front:p[0].trim(),Back:p[1].trim(),Tags:(p[2]||"").trim(),Due:"",Interval:"",Ease:"",Reviews:"",Lapses:""})}
}else{let R=parse(text);if(R.length){let h=R.shift();arr=R.map(r=>Object.fromEntries(h.map((k,j)=>[k,r[j]||""]))).filter(x=>x.Front&&x.Back)}}
if(!arr.length)return alert("問題を認識できませんでした");
let deckName=f.name.replace(/\.[^.]+$/,"");deckStore[deckName]=arr;saveDeckStore();refreshDecks();E("deckSelect").value=deckName;d=arr;localStorage.setItem("hayaoshi_last_name",deckName);build();
alert(d.length+"問を「"+deckName+"」として保存しました"+(d.some(x=>x.CardID)?"":"（Anki TXT：学習傾斜なし）"))};E("mode").onchange=build;E("spd").oninput=e=>E("sv").textContent=e.target.value+"ms/字";
E("export").onclick=()=>{if(!Q.length)return alert("同期待ちなし");let R=[["CardID","Ease","Date","Front"],...Q.map(x=>[x.CardID,x.Ease,x.Date,x.Front])],s=R.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));a.download="anki_sync_queue.csv";a.click()};
E("openDeck").onclick=()=>openSavedDeck(E("deckSelect").value);
E("deleteDeck").onclick=()=>{let n=E("deckSelect").value;if(!n||!deckStore[n])return;if(confirm("「"+n+"」を端末から削除しますか？")){delete deckStore[n];saveDeckStore();refreshDecks();let names=Object.keys(deckStore);if(names.length){E("deckSelect").value=names[0];openSavedDeck(names[0])}else{d=[];o=[];pos=0;E("q").textContent="";E("n").textContent="0/0"}}};
refreshDecks();
let last=localStorage.getItem("hayaoshi_last_name"),names=Object.keys(deckStore);
if(last&&deckStore[last]){E("deckSelect").value=last;openSavedDeck(last)}
else if(names.length){E("deckSelect").value=names[0];openSavedDeck(names[0])}
reset()
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));</script>
